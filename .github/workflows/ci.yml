name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://naib:naib@localhost:5432/naib
  REDIS_URL: redis://localhost:6379/0

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naib
          POSTGRES_PASSWORD: naib
          POSTGRES_DB: naib
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest -m "not eval and not redteam and not budget" --timeout=120
