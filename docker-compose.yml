services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: naib
      POSTGRES_PASSWORD: naib
      POSTGRES_DB: naib
    ports:
      - "5432:5432"
    volumes:
      - naib-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naib"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://naib:naib@postgres:5432/naib
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  naib-postgres-data:
